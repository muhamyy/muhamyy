<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Finance & Trading Journal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App (Compat) & Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- PIN Screen Modal -->
    <div id="pinModal" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Keamanan Aplikasi</h2>
            <p class="text-slate-400 text-sm mb-6">Masukkan 6 digit PIN untuk melanjutkan (Default: 123456)</p>
            <input type="password" id="pinInput" maxlength="6" class="w-full text-center tracking-widest text-2xl py-3 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-white focus:outline-none focus:border-emerald-500" placeholder="••••••">
            <button onclick="verifyPin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition">Buka Aplikasi</button>
            <p id="pinError" class="text-rose-500 text-xs mt-3 hidden">PIN salah, silakan coba lagi.</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="max-w-md mx-auto w-full p-4 flex-1 pb-20 hidden">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 pt-2">
            <div>
                <h1 id="appBrandTitle" class="text-xl font-bold text-emerald-400">My Finance</h1>
                <p class="text-xs text-slate-400">Cloud Sync Active</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openSettings()" class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Dashboard / Ringkasan -->
        <section class="space-y-4">
            <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-lg">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Total Saldo / Aset Bersih</p>
                <h2 id="totalBalance" class="text-3xl font-extrabold text-white mb-4">Rp 0</h2>
                
                <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800/80">
                    <div>
                        <p class="text-xs text-emerald-400 mb-1"><i class="fa-solid fa-arrow-down-long mr-1"></i> Pemasukan</p>
                        <p id="totalIncome" class="text-sm font-bold">Rp 0</p>
                    </div>
                    <div>
                        <p class="text-xs text-rose-400 mb-1"><i class="fa-solid fa-arrow-up-long mr-1"></i> Pengeluaran</p>
                        <p id="totalExpense" class="text-sm font-bold">Rp 0</p>
                    </div>
                </div>
            </div>

            <!-- Tab Content: Keuangan -->
            <div id="tabFinance" class="space-y-4 pt-2">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-slate-200">Daftar Pemasukan</h3>
                        <button onclick="addIncomePrompt()" class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-lg font-semibold">+ Tambah</button>
                    </div>
                    <div id="incomeList" class="space-y-2 text-sm"></div>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-slate-200">Daftar Pengeluaran</h3>
                        <button onclick="addExpensePrompt()" class="text-xs bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg font-semibold">+ Tambah</button>
                    </div>
                    <div id="expenseList" class="space-y-2 text-sm"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Pengaturan Aplikasi</h3>
            <label class="block text-xs text-slate-400 mb-1">Nama Aplikasi</label>
            <input type="text" id="appNameInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm mb-4 text-white focus:outline-none focus:border-emerald-500">
            <div class="flex gap-2">
                <button onclick="saveSettings()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-semibold text-sm transition">Simpan</button>
                <button onclick="closeSettings()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl font-semibold text-sm transition">Batal</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logika & Firebase Realtime -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCFc7Tm42BwhoZNZ57cWCb8iweYb-bNVrc",
          authDomain: "muhamyy-545d1.firebaseapp.com",
          databaseURL: "https://muhamyy-545d1-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "muhamyy-545d1",
          storageBucket: "muhamyy-545d1.appspot.com",
          messagingSenderId: "870416373070",
          appId: "1:870416373070:web:c927e76b9e48be6e80ba1f",
          measurementId: "G-BCT5L9ZDZ5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(firebase.app());
        const dbRef = db.ref('my_finance_data');

        let data = {
          income: [
            { id: 1, name: "Gaji Utama", value: 12000000 },
            { id: 2, name: "Dividen Saham", value: 1500000 }
          ],
          expense: [
            { id: 1, name: "Listrik & Air", value: 600000 },
            { id: 2, name: "Belanja Bulanan", value: 2500000 }
          ]
        };

        function saveDataToCloud() {
            dbRef.set(data);
        }

        function verifyPin() {
            const inputPin = document.getElementById('pinInput').value;
            const savedPin = localStorage.getItem('myFinancePin') || '123456';
            if(inputPin === savedPin) {
                document.getElementById('pinModal').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                initRealtimeSync();
            } else {
                document.getElementById('pinError').classList.remove('hidden');
            }
        }

        function initRealtimeSync() {
            dbRef.on("value", (snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData) {
                    data = cloudData;
                } else {
                    saveDataToCloud();
                }
                render();
            });
        }

        function render() {
            let totalInc = data.income.reduce((sum, item) => sum + Number(item.value), 0);
            let totalExp = data.expense.reduce((sum, item) => sum + Number(item.value), 0);
            let netBalance = totalInc - totalExp;

            document.getElementById('totalIncome').innerText = formatIDR(totalInc);
            document.getElementById('totalExpense').innerText = formatIDR(totalExp);
            document.getElementById('totalBalance').innerText = formatIDR(netBalance);

            let incHtml = '';
            data.income.forEach((item, index) => {
                incHtml += `<div class="flex justify-between items-center py-1.5 border-b border-slate-800/50">
                    <span>${item.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-emerald-400 font-semibold">${formatIDR(item.value)}</span>
                        <button onclick="deleteItem('income', ${index})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('incomeList').innerHTML = incHtml || '<p class="text-slate-500 text-xs">Belum ada pemasukan.</p>';

            let expHtml = '';
            data.expense.forEach((item, index) => {
                expHtml += `<div class="flex justify-between items-center py-1.5 border-b border-slate-800/50">
                    <span>${item.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-rose-400 font-semibold">${formatIDR(item.value)}</span>
                        <button onclick="deleteItem('expense', ${index})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('expenseList').innerHTML = expHtml || '<p class="text-slate-500 text-xs">Belum ada pengeluaran.</p>';
        }

        function formatIDR(num) {
            return "Rp " + Number(num).toLocaleString('id-ID');
        }

        function addIncomePrompt() {
            let name = prompt("Nama Pemasukan:");
            let value = prompt("Nominal (Angka):");
            if(name && value) {
                data.income.push({ id: Date.now(), name, value: Number(value) });
                saveDataToCloud();
            }
        }

        function addExpensePrompt() {
            let name = prompt("Nama Pengeluaran:");
            let value = prompt("Nominal (Angka):");
            if(name && value) {
                data.expense.push({ id: Date.now(), name, value: Number(value) });
                saveDataToCloud();
            }
        }

        function deleteItem(type, index) {
            data[type].splice(index, 1);
            saveDataToCloud();
        }

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            let newName = document.getElementById('appNameInput').value;
            if(newName) {
                localStorage.setItem("myFinanceAppName", newName);
                document.getElementById('appBrandTitle').innerText = newName;
            }
            closeSettings();
        }

        window.onload = function() {
            const appName = localStorage.getItem("myFinanceAppName") || "My Finance";
            document.getElementById("appBrandTitle").innerText = appName;
            document.getElementById("appNameInput").value = appName;
        };
    </script>
</body>
</html>
