</div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeEditPlatformModal()">Selesai</button>
    </div>
  </div>
</div>

<script>
// LANJUTAN SKRIP APLIKASI
let pinEntered = "";
const correctPin = "123456"; // PIN Default

function pressPin(num) {
  if (num === 'C') {
    pinEntered = "";
  } else if (num === 'DEL') {
    pinEntered = pinEntered.slice(0, -1);
  } else {
    if (pinEntered.length < 6) pinEntered += num;
  }
  
  for (let i = 1; i <= 6; i++) {
    const dot = document.getElementById(`dot${i}`);
    if (i <= pinEntered.length) {
      dot.classList.add("filled");
    } else {
      dot.classList.remove("filled");
    }
  }

  if (pinEntered.length === 6) {
    if (pinEntered === correctPin || pinEntered === (localStorage.getItem("myFinancePin") || "123456")) {
      document.getElementById("pinOverlay").style.opacity = "0";
      setTimeout(() => {
        document.getElementById("pinOverlay").style.display = "none";
      }, 300);
    } else {
      alert("PIN Salah! Coba lagi.");
      pinEntered = "";
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`dot${i}`).classList.remove("filled");
      }
    }
  }
}

// Data State Utama
let currentDate = new Date();
let currentTheme = "dark";
let appName = localStorage.getItem("myFinanceAppName") || "My Finance";

let data = {
  income: [
    { id: 1, name: "Gaji Utama", value: 12000000 },
    { id: 2, name: "Dividen Saham", value: 1500000 }
  ],
  expense: [
    { id: 1, name: "Listrik & Air", value: 600000 },
    { id: 2, name: "Belanja Bulanan", value: 2500000 },
    { id: 3, name: "Internet & Telpon", value: 450000 }
  ],
  debt: [
    { id: 1, name: "Cicilan Mobil", value: 3500000, paid: false },
    { id: 2, name: "Cicilan Laptop", value: 1200000, paid: true }
  ],
  tradingDays: {}, // format: "YYYY-MM-DD": value
  tradingTarget: 1000000,
  matrixColumns: ["BCA", "Mandiri", "Blu", "Seabank", "GoPay"],
  matrixRows: [
    { month: "Jan 2026", data: { BCA: 500000, Mandiri: 0, Blu: 0, Seabank: 0, GoPay: 0 }, paid: { BCA: false, Mandiri: false, Blu: false, Seabank: false, GoPay: false } },
    { month: "Feb 2026", data: { BCA: 500000, Mandiri: 0, Blu: 0, Seabank: 0, GoPay: 0 }, paid: { BCA: false, Mandiri: false, Blu: false, Seabank: false, GoPay: false } }
  ]
};

// Inisialisasi awal aplikasi
window.onload = function() {
  document.getElementById("appNameInput").value = appName;
  document.getElementById("appBrandTitle").innerText = appName;
  render();
};

function switchModule(moduleId, el) {
  document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');
  changeView(moduleId);
}

function switchModuleMobile(moduleId, el) {
  document.querySelectorAll('.mobile-nav-item').forEach(item => item.classList.remove('active'));
  el.classList.add('active');
  changeView(moduleId);
}

function changeView(moduleId) {
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  document.getElementById(`view-${moduleId}`).classList.add('active');
  
  const titles = {
    dashboard: ["Dashboard Keuangan", "Ringkasan grafik total keuangan bulanan"],
    trading: ["Trading Journal", "Catatan target profit harian trading"],
    income: ["Pemasukan", "Daftar sumber pemasukan bulan ini"],
    expense: ["Pengeluaran", "Daftar pengeluaran rutin & operasional"],
    debt: ["Cicilan Bulanan", "Kontrol dan status pelunasan cicilan"],
    matrix: ["Matriks Cicilan", "Proyeksi angsuran multi-platform"],
    settings: ["Pengaturan", "Kustomisasi sistem & keamanan aplikasi"]
  };
  
  document.getElementById("pageTitle").innerText = titles[moduleId][0];
  document.getElementById("pageSubTitle").innerText = titles[moduleId][1];
  
  if(moduleId === 'dashboard') updateCharts();
}

function formatRupiah(val) {
  return "Rp" + Number(val || 0).toLocaleString("id-ID");
}

function parseNumber(str) {
  if (!str) return 0;
  return Number(String(str).replace(/[^0-9-]/g, "")) || 0;
}

function changeMonth(dir) {
  currentDate.setMonth(currentDate.getMonth() + dir);
  render();
}

function resetMonth() {
  if(confirm("Reset data bulan ini?")) {
    render();
  }
}

function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", currentTheme);
  document.getElementById("themeBtn").innerText = currentTheme === "dark" ? "☀️ Light" : "🌙 Dark";
}

function render() {
  const monthsNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  document.getElementById("monthLabel").innerText = `${monthsNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  
  // Hitung Total
  let totalInc = data.income.reduce((acc, item) => acc + Number(item.value || 0), 0);
  let totalExp = data.expense.reduce((acc, item) => acc + Number(item.value || 0), 0);
  let totalDeb = data.debt.reduce((acc, item) => acc + Number(item.value || 0), 0);
  let balance = totalInc - (totalExp + totalDeb);

  document.getElementById("sumIncome").innerText = formatRupiah(totalInc);
  document.getElementById("sumExpense").innerText = formatRupiah(totalExp);
  document.getElementById("sumDebt").innerText = formatRupiah(totalDeb);
  document.getElementById("sumBalance").innerText = formatRupiah(balance);

  renderIncome();
  renderExpense();
  renderDebt();
  renderTradingCalendar();
  renderMatrix();
  renderDashboardProgress();
  updateCharts();
}

// Render Pemasukan
function renderIncome() {
  const query = (document.getElementById("searchIncome").value || "").toLowerCase();
  const container = document.getElementById("incomeRows");
  container.innerHTML = "";
  let total = 0;

  data.income.forEach((item, index) => {
    if(item.name.toLowerCase().includes(query)) {
      total += Number(item.value || 0);
      container.innerHTML += `
        <div class="row">
          <input type="text" class="name" value="${item.name}" onchange="updateItem('income', ${index}, 'name', this.value)">
          <input type="text" class="value" value="${Number(item.value).toLocaleString('id-ID')}" onchange="updateItem('income', ${index}, 'value', parseNumber(this.value))">
          <button class="del" onclick="deleteItem('income', ${index})">×</button>
        </div>
      `;
    }
  });
  document.getElementById("incomeTotal").innerText = formatRupiah(total);
}

// Render Pengeluaran
function renderExpense() {
  const query = (document.getElementById("searchExpense").value || "").toLowerCase();
  const container = document.getElementById("expenseRows");
  container.innerHTML = "";
  let total = 0;

  data.expense.forEach((item, index) => {
    if(item.name.toLowerCase().includes(query)) {
      total += Number(item.value || 0);
      container.innerHTML += `
        <div class="row">
          <input type="text" class="name" value="${item.name}" onchange="updateItem('expense', ${index}, 'name', this.value)">
          <input type="text" class="value" value="${Number(item.value).toLocaleString('id-ID')}" onchange="updateItem('expense', ${index}, 'value', parseNumber(this.value))">
          <button class="del" onclick="deleteItem('expense', ${index})">×</button>
        </div>
      `;
    }
  });
  document.getElementById("expenseTotal").innerText = formatRupiah(total);
}

// Render Cicilan
function renderDebt() {
  const query = (document.getElementById("searchDebt").value || "").toLowerCase();
  const container = document.getElementById("debtRows");
  container.innerHTML = "";
  let total = 0;
  let paidCount = 0;

  data.debt.forEach((item, index) => {
    if(item.paid) paidCount++;
    if(item.name.toLowerCase().includes(query)) {
      total += Number(item.value || 0);
      container.innerHTML += `
        <div class="row item-row-checked ${item.paid ? 'paid-row' : ''}">
          <input type="checkbox" class="check-paid" ${item.paid ? 'checked' : ''} onchange="toggleDebtPaid(${index})">
          <input type="text" class="name" value="${item.name}" onchange="updateItem('debt', ${index}, 'name', this.value)">
          <input type="text" class="value" value="${Number(item.value).toLocaleString('id-ID')}" onchange="updateItem('debt', ${index}, 'value', parseNumber(this.value))">
          <button class="del" onclick="deleteItem('debt', ${index})">×</button>
        </div>
      `;
    }
  });
  document.getElementById("debtTotal").innerText = formatRupiah(total);
  const pct = data.debt.length ? Math.round((paidCount / data.debt.length) * 100) : 0;
  document.getElementById("debtProgressInfo").innerText = `Progress Lunas: ${paidCount} dari ${data.debt.length} (${pct}%)`;
}

function addItem(type) {
  data[type].push({ id: Date.now(), name: "Item Baru", value: 0, paid: false });
  render();
}

function updateItem(type, index, field, val) {
  data[type][index][field] = val;
  render();
}

function deleteItem(type, index) {
  data[type].splice(index, 1);
  render();
}

function toggleDebtPaid(index) {
  data.debt[index].paid = !data.debt[index].paid;
  render();
}

// Trading Calendar
function renderTradingCalendar() {
  const container = document.getElementById("calendarDays");
  container.innerHTML = "";
  let year = currentDate.getFullYear();
  let month = currentDate.getMonth();
  
  let firstDayIndex = new Date(year, month, 1).getDay();
  let totalDays = new Date(year, month + 1, 0).getDate();
  
  let monthTotal = 0;

  for (let i = 0; i < firstDayIndex; i++) {
    container.innerHTML += `<div></div>`;
  }

  for (let day = 1; day <= totalDays; day++) {
    let dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    let val = data.tradingDays[dateStr] || 0;
    monthTotal += Number(val);
    
    let statusClass = "";
    if (val > 0) statusClass = val >= data.tradingTarget ? "target-reached" : "target-loss";

    container.innerHTML += `
      <div class="day-card ${statusClass}">
        <span class="day-num">${day}</span>
        <input type="text" value="${val ? Number(val).toLocaleString('id-ID') : ''}" placeholder="0" onchange="updateTradingDay('${dateStr}', parseNumber(this.value))">
      </div>
    `;
  }
  document.getElementById("tradingMonthTotal").innerText = formatRupiah(monthTotal);
}

function updateTradingDay(dateStr, val) {
  data.tradingDays[dateStr] = val;
  render();
}

function updateTradingTarget(val) {
  data.tradingTarget = parseNumber(val);
  render();
}

// Matriks Angsuran
function renderMatrix() {
  const table = document.getElementById("matrixTable");
  let html = `<thead><tr><th>Bulan</th>`;
  data.matrixColumns.forEach(col => { html += `<th>${col}</th>`; });
  html += `<th>Aksi</th></tr></thead><tbody>`;

  data.matrixRows.forEach((rowObj, rIdx) => {
    html += `<tr><td style="font-weight:700;">${rowObj.month}</td>`;
    data.matrixColumns.forEach(col => {
      let cellVal = rowObj.data[col] || 0;
      let isPaid = rowObj.paid && rowObj.paid[col];
      let cellClass = isPaid ? "cell-done" : "";
      let badgeText = isPaid ? "LUNAS" : "BELUM";
      let badgeClass = isPaid ? "is-paid" : "is-unpaid";

      html += `
        <td class="${cellClass}">
          <input type="text" class="value" value="${cellVal ? Number(cellVal).toLocaleString('id-ID') : ''}" onchange="updateMatrixCell(${rIdx}, '${col}', parseNumber(this.value))" style="background:transparent; border:none; text-align:center;">
          <br><button class="badge-status ${badgeClass}" onclick="toggleMatrixPaid(${rIdx}, '${col}')">${badgeText}</button>
        </td>
      `;
    });
    html += `<td><button class="del" onclick="deleteMatrixRow(${rIdx})">×</button></td></tr>`;
  });
  html += `</tbody>`;
  table.innerHTML = html;
}

function updateMatrixCell(rIdx, col, val) {
  data.matrixRows[rIdx].data[col] = val;
  render();
}

function toggleMatrixPaid(rIdx, col) {
  if(!data.matrixRows[rIdx].paid) data.matrixRows[rIdx].paid = {};
  data.matrixRows[rIdx].paid[col] = !data.matrixRows[rIdx].paid[col];
  render();
}

function addMatrixColumn() {
  let name = prompt("Nama Platform Baru:");
  if(name) {
    data.matrixColumns.push(name);
    data.matrixRows.forEach(row => {
      row.data[name] = 0;
      if(!row.paid) row.paid = {};
      row.paid[name] = false;
    });
    render();
  }
}

function deleteMatrixRow(rIdx) {
  data.matrixRows.splice(rIdx, 1);
  render();
}

// Edit Platform Modal
function openEditPlatformModal() {
  const modal = document.getElementById("editPlatformModal");
  const body = modal.querySelector(".modal-body");
  body.innerHTML = "";
  
  data.matrixColumns.forEach((col, idx) => {
    body.innerHTML += `
      <div class="platform-edit-row">
        <span class="drag-handle">☰</span>
        <input type="text" class="value" value="${col}" onchange="renamePlatform(${idx}, this.value)" style="text-align:left; background:transparent; border:none;">
        <button class="del" onclick="deletePlatform(${idx})">×</button>
      </div>
    `;
  });
  modal.classList.add("active");
}

function closeEditPlatformModal() {
  document.getElementById("editPlatformModal").classList.remove("active");
  render();
}

function renamePlatform(idx, val) {
  let oldName = data.matrixColumns[idx];
  data.matrixColumns[idx] = val;
  data.matrixRows.forEach(row => {
    row.data[val] = row.data[oldName];
    delete row.data[oldName];
    if(row.paid) {
      row.paid[val] = row.paid[oldName];
      delete row.paid[oldName];
    }
  });
}

function deletePlatform(idx) {
  let col = data.matrixColumns[idx];
  data.matrixColumns.splice(idx, 1);
  data.matrixRows.forEach(row => {
    delete row.data[col];
    if(row.paid) delete row.paid[col];
  });
  openEditPlatformModal();
}

// Dashboard Progress & Charts
let barChartInstance = null;
let pieChartInstance = null;

function renderDashboardProgress() {
  const container = document.getElementById("dashPlatformProgressContainer");
  container.innerHTML = "";
  
  data.matrixColumns.forEach(col => {
    let totalTarget = 0;
    let totalPaid = 0;
    data.matrixRows.forEach(row => {
      totalTarget += Number(row.data[col] || 0);
      if(row.paid && row.paid[col]) totalPaid += Number(row.data[col] || 0);
    });
    let pct = totalTarget > 0 ? Math.round((totalPaid / totalTarget) * 100) : 0;
    
    container.innerHTML += `
      <div class="platform-progress-card">
        <div class="platform-progress-info">
          <span>${col}</span>
          <span style="font-family:var(--font-mono);">${formatRupiah(totalPaid)} / ${formatRupiah(totalTarget)} (${pct}%)</span>
        </div>
        <div class="platform-bar-bg">
          <div class="platform-bar-fill" style="width: ${pct}%"></div>
        </div>
      </div>
    `;
  });
}

function updateCharts() {
  let totalInc = data.income.reduce((a, b) => a + Number(b.value || 0), 0);
  let totalExp = data.expense.reduce((a, b) => a + Number(b.value || 0), 0);
  let totalDeb = data.debt.reduce((a, b) => a + Number(b.value || 0), 0);

  // Bar Chart
  const ctxBar = document.getElementById('barChart').getContext('2d');
  if (barChartInstance) barChartInstance.destroy();
  barChartInstance = new Chart(ctxBar, {
    type: 'bar',
    data: {
      labels: ['Pemasukan', 'Pengeluaran', 'Cicilan'],
      datasets: [{
        label: 'Jumlah (Rp)',
        data: [totalInc, totalExp, totalDeb],
        backgroundColor: ['#00f2fe', '#ff416c', '#ffb199'],
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { ticks: { color: '#e9d5ff' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        x: { ticks: { color: '#e9d5ff' }, grid: { display: false } }
      }
    }
  });

  // Pie Chart
  const ctxPie = document.getElementById('pieChart').getContext('2d');
  if (pieChartInstance) pieChartInstance.destroy();
  let expLabels = data.expense.map(e => e.name);
  let expValues = data.expense.map(e => e.value);

  pieChartInstance = new Chart(ctxPie, {
    type: 'doughnut',
    data: {
      labels: expLabels.length ? expLabels : ['Belanja', 'Lainnya'],
      datasets: [{
        data: expValues.length ? expValues : [1],
        backgroundColor: ['#d946ef', '#3b82f6', '#10b981', '#f59e0b', '#ff416c']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { color: '#e9d5ff', boxWidth: 12 } } }
    }
  });
}

// Settings & Security
function updateAppName(name) {
  appName = name || "My Finance";
  localStorage.setItem("myFinanceAppName", appName);
  document.getElementById("appBrandTitle").innerText = appName;
}

function changeSystemPin() {
  const pin = document.getElementById("newPinInput").value;
  if (pin.length === 6 && !isNaN(pin)) {
    localStorage.setItem("myFinancePin", pin);
    alert("PIN Keamanan berhasil diperbarui!");
    document.getElementById("newPinInput").value = "";
  } else {
    alert("PIN harus berupa tepat 6 digit angka!");
  }
}

function updateThemeColor(color) {
  let rgb = hexToRgb(color);
  if(rgb) {
    document.documentElement.style.setProperty('--primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
  }
}

function hexToRgb(hex) {
  let bigint = parseInt(hex.replace("#",""), 16);
  let r = (bigint >> 16) & 255;
  let g = (bigint >> 8) & 255;
  let b = bigint & 255;
  return {r, g, b};
}

function exportDataJSON() {
  let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
  let dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", "my_finance_backup.json");
  dlAnchorElem.click();
}

function importDataJSON(event) {
  let file = event.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = function(e) {
    try {
      data = JSON.parse(e.target.result);
      render();
      alert("Data berhasil dipulihkan!");
    } catch(err) {
      alert("Format file JSON tidak valid!");
    }
  };
  reader.readAsText(file);
}
</script>
</body>
